name: Publish to PyPI

# Runs when a version tag (v1.0.1, v1.1.0, ...) is pushed.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in GitHub.
# One-time setup on pypi.org -> Account settings -> Publishing -> add publisher:
#   PyPI project name: dbt-kinetica
#   Owner:             rosettadb
#   Repository:        kinetica-dbt-adapter
#   Workflow name:     publish.yml
#   Environment name:  pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' dbt/adapters/kinetica/__version__.py)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG_VERSION"
          test "$PKG_VERSION" = "$TAG_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dbt-kinetica/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
