[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-kinetica"
dynamic = ["version"]
description = "The Kinetica adapter plugin for dbt"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "rosettadb" }]
keywords = ["dbt", "kinetica", "adapter", "gpudb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dbt-core>=1.8.0,<2.0",
    "dbt-adapters>=1.7.0,<2.0",
    "dbt-common>=1.10.0,<2.0",
    "gpudb>=7.2.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock",
    "dbt-tests-adapter>=1.10.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/rosettadb/kinetica-dbt-adapter"

[tool.setuptools.dynamic]
version = { attr = "dbt.adapters.kinetica.__version__.version" }

[tool.setuptools.packages.find]
where = ["."]
include = ["dbt.adapters.kinetica*", "dbt.include.kinetica*"]
namespaces = true

[tool.setuptools.package-data]
"dbt.include.kinetica" = [
    "dbt_project.yml",
    "profile_template.yml",
    "sample_profiles.yml",
    "macros/*.sql",
    "macros/*/*.sql",
    "macros/*/*/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["functional: tests that need a live Kinetica server"]
